# MechDojo: practice questions for mechanical engineering students, and
# marking of their numeric answers. No network: the question bank is
# questions.json, beside app.py.

manifest_version: 1

# Every hackathon app keeps nothing between calls. Do not change this.
persistence: none

# Public author name (a pseudonym). Shown as "by <name>" next to the app.
app_author_name: "MechDojo"

app:
  # Fixed by the repository name: Pippa-Labs/pippa-hack-app-2a90-2.
  id: hack.app_2a90_2
  name: MechDojo
  version: 0.1.0
  # Never use the word "by" here: the badge is parsed on it.
  summary: >-
    Gives mechanical engineering students a practice question on a topic they
    choose, then checks their numeric answer and shows the worked solution.

agent_types:
  - personal

outcomes:
  - id: question.get
    summary: Give a mechanical engineering practice question on thermodynamics, fluid mechanics, solid mechanics or dynamics
    example_phrases:
      - give me a practice question on
      - quiz me on mechanical engineering
      - give me a mechanics problem
      - test me on engineering
      - drill me on engineering mechanics
      - set me an engineering problem to solve
      - i want a practice problem on
    inputs:
      - name: topic
        type: string
        required: false
        description: >-
          The engineering topic the person wants a question on, in their own
          words, for example "thermo", "fluids", "beams" or "vibration". If
          the message does not name a topic, return an empty string rather
          than guessing.
    output:
      - name: question_id
        type: string
        description: The question's code, such as TH-03. The student quotes it when answering.
      - name: topic
        type: string
        description: The topic of the question.
      - name: question
        type: string
        description: The question, with every value given in SI units.
      - name: how_to_answer
        type: string
        description: How the student should send their answer back.

  - id: answer.check
    summary: Mark the number a student worked out for a code such as TH-03, and show the worked solution
    example_phrases:
      - check my answer to
      - is my answer right for
      - mark my answer for
      - here is my answer to
      - was my number correct
      - did i get the right number
      - grade my working for
      - my calculated answer is
    inputs:
      - name: question_id
        type: string
        required: false
        description: >-
          The question code the person gives: two letters and a number, such
          as "TH-03" or "FL-02", exactly as written. If the message has no
          code, return an empty string rather than guessing.
      - name: answer
        type: number
        required: false
        description: >-
          The number the person gives as their answer, without its unit. Leave
          this out entirely if they gave no number. Never guess one, and never
          use the digits of the question code.
    output:
      - name: correct
        type: boolean
        description: Whether the answer is within the question's tolerance.
      - name: your_answer
        type: string
        description: The student's answer, with the question's unit.
      - name: right_answer
        type: string
        description: The correct answer, with its unit.
      - name: worked_solution
        type: string
        description: A short worked solution showing the method and the result.
